generated: '2026-07-19'
method: searched
source: https://docs.kyberswap.com/ai-agent-hub/skills-for-local-agents
summary: >-
  KyberSwap publishes a first-party Agent Skills plugin for local coding agents
  as part of its AI Agent Hub. This index records the provider's published
  skills verbatim, and adds four API Evangelist packaged skills that ground the
  same marquee flows in the operationIds harvested into openapi/.
provider_published:
  repository: https://github.com/KyberNetwork/kyberswap-skills
  docs: https://docs.kyberswap.com/ai-agent-hub/skills-for-local-agents
  install:
  - method: claude-plugin
    command: /install-plugin https://github.com/kyberswap/kyberswap-skills
  - method: local
    command: claude --plugin-dir /path/to/kyberswap-skills
  - method: npx
    command: npx skills add KyberNetwork/kyberswap-skills
    note: currently supports the swap and price discovery skills
  backing_apis:
  - name: Aggregator API
    host: aggregator-api.kyberswap.com
    purpose: swap routing and calldata
  - name: Token API
    host: token-api.kyberswap.com
    purpose: metadata, pricing, honeypot detection
  - name: Earn Service
    host: earn-service.kyberswap.com
    purpose: pool and position data
  skills:
  - name: quote
    group: price discovery
    description: Get the best swap route and expected output for a token pair. Includes
      gas estimates, route path, and safety checks.
  - name: token-info
    group: price discovery
    description: Look up token metadata, live USD price, decimals, and security assessment
      (honeypot/fee-on-transfer detection).
  - name: pool-info
    group: price discovery
    description: Query liquidity pool details — TVL, 24h volume, fee tier, APR, LP APR,
      and token pair info across all indexed DEXes.
  - name: swap-build
    group: swap lifecycle
    description: Build a swap transaction with encoded calldata. Applies intelligent
      slippage defaults.
  - name: swap-simulate
    group: swap lifecycle
    description: Dry-run a swap transaction using cast call — no gas spent, no state
      changed.
  - name: swap-execute
    group: swap lifecycle
    description: Broadcast a built swap transaction on-chain via Foundry's cast send.
  - name: swap-status
    group: swap lifecycle
    description: Check whether a submitted transaction succeeded or failed.
  - name: swap-approve
    group: swap lifecycle
    description: Manage ERC-20 token approvals for the KyberSwap router.
  - name: swap-execute-fast
    group: fast path
    description: Build and execute a swap in one step with no confirmation prompts.
  - name: limit-order-fast
    group: fast path
    description: Sign and create a limit order in one step with no confirmation.
  - name: zap-fast
    group: fast path
    description: Build and execute a zap in one step with no confirmation.
  - name: limit-order
    group: limit orders and liquidity
    description: Create, query, and cancel gasless limit orders signed off-chain via
      EIP-712.
  - name: order-manager
    group: limit orders and liquidity
    description: View and analyze limit orders across all statuses — open, partially
      filled, filled, cancelled.
  - name: zap
    group: limit orders and liquidity
    description: Zap into or out of concentrated liquidity positions in one transaction.
  - name: position-manager
    group: limit orders and liquidity
    description: View and analyze DeFi liquidity positions — in-range/out-of-range status,
      APR, fees.
  - name: error-handling
    group: diagnostics
    description: Comprehensive error diagnosis covering API errors, pre-transaction failures,
      and on-chain reverts.
