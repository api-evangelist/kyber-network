aid: kyber-network
name: Kyber Network
description: >-
  Kyber Network is the team behind KyberSwap, a multi-chain DeFi liquidity hub and DEX
  aggregator that routes trades across indexed decentralized exchanges to source the best
  available on-chain rate. It publishes three public, unauthenticated EVM APIs: the Aggregator
  API for instant token swaps with dynamic trade routing, the Limit Order API for gasless
  price-conditional trades using off-chain relay with on-chain settlement, and the Zap as a
  Service (ZaaS) API for single-transaction concentrated liquidity provision, exit and
  migration. KyberSwap also ships embeddable React swap and liquidity widgets, an RFC 9727
  API catalog, an llms.txt documentation index, a first-party MCP server and a published
  Agent Skills plugin, making it one of the more agent-ready providers in the DeFi category.
  Governance runs through KyberDAO and the KNC token.
